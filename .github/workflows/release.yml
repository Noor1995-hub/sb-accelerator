# Release — tag-triggered publish to the client-facing marketplace (#10).
#
# Two ways in:
#   - `git push` a tag matching `plugin-v*` — always channel=dryrun (the
#     dryrun repair path and the client promotion are always explicit acts,
#     never implied by a tag push).
#   - `workflow_dispatch` with `tag` (required) and `channel`
#     (dryrun|client, default client) — re-running dryrun for a given tag is
#     the repair path when a prior run left it out of sync; dispatching
#     channel=client is how a tag is promoted after the dryrun run is green.
#
# One job chain, channel resolved up front in `resolve` so every later job
# reads it from `needs.resolve.outputs` rather than re-deriving it.
#
# Every value that starts life as a `workflow_dispatch` input or another
# job's output is passed into `run:` steps via `env:` and read back as a
# shell variable ($TAG, $VERSION, ...) rather than interpolated directly
# into the script text with `${{ }}` — a value containing shell
# metacharacters would otherwise be executed as script, not treated as
# data (classic Actions script-injection). This matters most for `publish`,
# which holds DIST_PUSH_TOKEN.
name: Release

on:
  push:
    tags:
      - 'plugin-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. plugin-v0.10.24'
        required: true
      channel:
        description: 'Distribution channel'
        required: true
        default: 'client'
        type: choice
        options:
          - dryrun
          - client

permissions: {}

# One release train per channel at a time; never cancel a running publish
# mid-push. A tag push is always channel=dryrun for grouping purposes even
# though the job below is what actually enforces the value.
concurrency:
  group: release-${{ github.event_name == 'push' && 'dryrun' || inputs.channel }}
  cancel-in-progress: false

jobs:
  resolve:
    name: resolve release parameters
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      channel: ${{ steps.set.outputs.channel }}
      version: ${{ steps.set.outputs.version }}
      dist_repo: ${{ steps.set.outputs.dist_repo }}
      marketplace: ${{ steps.set.outputs.marketplace }}
    steps:
      - name: resolve tag, channel, version, dist repo, marketplace
        id: set
        env:
          # github.event_name is a fixed value GitHub sets ("push" or
          # "workflow_dispatch"), never attacker-influenced, so it's fine
          # interpolated directly below. inputs.tag/inputs.channel are
          # free-form dispatch input — passed through env, not interpolated
          # into the script, so their content is just data to bash, never
          # code, however it's spelled.
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            channel="dryrun"
          else
            tag="$INPUT_TAG"
            channel="$INPUT_CHANNEL"
          fi

          if ! [[ "$tag" =~ ^plugin-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$tag' does not match ^plugin-v\\d+\\.\\d+\\.\\d+\$ — refusing"
            exit 1
          fi
          version="${tag#plugin-v}"

          case "$channel" in
            dryrun) dist_repo="sb-dist-dryrun"; marketplace="sb-accelerator-dryrun" ;;
            client) dist_repo="sb-dist"; marketplace="sb-accelerator" ;;
            *) echo "::error::channel '$channel' must be 'dryrun' or 'client'"; exit 1 ;;
          esac

          echo "Releasing $tag (version $version) to channel=$channel -> $dist_repo"
          {
            echo "tag=$tag"
            echo "channel=$channel"
            echo "version=$version"
            echo "dist_repo=$dist_repo"
            echo "marketplace=$marketplace"
          } >> "$GITHUB_OUTPUT"

  verify:
    name: verify tag (${{ needs.resolve.outputs.channel }})
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - name: resolve the tag's commit sha
        id: resolve_sha
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # GITHUB_SHA is the *triggering event's* sha, which under
          # workflow_dispatch is main's tip at dispatch time — not this
          # tag's commit. Every later job needs the tag's real commit, so
          # resolve it here, once, from the tag ref actually checked out.
          # `^{commit}` dereferences an annotated tag object to the commit
          # it points at (cut_release.sh creates annotated tags); it is a
          # no-op for a lightweight tag.
          sha=$(git rev-parse "refs/tags/${TAG}^{commit}")
          echo "tag $TAG -> commit $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: install deps
        run: pip install pytest pyyaml
      - name: plugin.json version must match the tag
        env:
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
          if [ "$version" != "$EXPECTED_VERSION" ]; then
            echo "::error::plugin.json version ($version) != tag version ($EXPECTED_VERSION)"
            exit 1
          fi
      - name: refuse a tag that is not on main (no side-branch releases)
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # Explicit refspec (rather than a bare `git fetch origin main`) so
          # the local ref this creates is unambiguous, and a distinct
          # rev-parse check first so a fetch problem is reported as exactly
          # that — not folded into the ancestor check below and misread as
          # "not on main".
          git fetch origin main:refs/remotes/origin/main --quiet
          if ! git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "::error::could not resolve origin/main after fetching it — this is a fetch problem, not a policy violation"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG" origin/main; then
            echo "::error::$TAG is not an ancestor of origin/main — refusing a side-branch release"
            exit 1
          fi
      - name: skill lint + clean-room scan
        run: python scripts/lint_plugin.py
      - name: template structure validation
        run: python scripts/validate_template.py
      - name: validator unit tests
        run: python -m pytest scripts/tests -q

  build:
    name: build dist tree (${{ needs.resolve.outputs.channel }})
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: install deps
        run: pip install pyyaml
      - name: build the dist tree (runs the real clean-room linter on the output)
        env:
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          TAG: ${{ needs.resolve.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          python scripts/build_dist.py build \
            --channel "$CHANNEL" \
            --out dist \
            --source-ref "$TAG" \
            --source-sha "$SOURCE_SHA"
      - name: zip the plugin package
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          zip_name="plugin-${VERSION}.zip"
          # Zip rooted at plugin/'s own contents, not at "plugin/" itself —
          # this is the archive path E (manual ZIP upload) needs: a plugin
          # package with .claude-plugin/plugin.json at the zip root.
          (cd dist/plugin && zip -qr "$GITHUB_WORKSPACE/$zip_name" .)
          sha256sum "$zip_name" > "${zip_name}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-tree
          path: dist
          # upload-artifact@v4.4+ excludes dotfiles by default, which would
          # silently drop .claude-plugin/, .gitignore, and everything under
          # plugin/template/.obsidian/ — exactly the tree `publish` then
          # wipes the dist repo to make room for. Without this, a truncated
          # artifact would look like a normal successful build.
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: |
            plugin-${{ needs.resolve.outputs.version }}.zip
            plugin-${{ needs.resolve.outputs.version }}.zip.sha256
          retention-days: 90

  publish:
    name: publish to ${{ needs.resolve.outputs.dist_repo }}
    needs: [resolve, verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-tree
          path: dist
      - name: sanity-check the downloaded artifact before touching the dist repo
        run: |
          set -euo pipefail
          # Belt-and-suspenders alongside include-hidden-files above: an
          # artifact that lost its hidden files must never reach `git push`.
          # Failing here, before the dist repo is even cloned, means a
          # truncated build can never wipe a good tree for a bad one.
          missing=0
          for f in \
            dist/.claude-plugin/marketplace.json \
            dist/.gitignore \
            dist/README.md \
            dist/CHANGELOG.md \
            dist/RELEASE.json \
            dist/plugin/.claude-plugin/plugin.json \
            dist/plugin/template/structure-version \
            dist/plugin/template/.obsidian/app.json; do
            if [ ! -e "$f" ]; then
              echo "::error::downloaded dist-tree artifact is missing $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::dist-tree artifact looks truncated (hidden files likely dropped on upload) — refusing to touch the dist repo"
            exit 1
          fi
          echo "artifact sanity check OK"
      - name: clone the dist repo
        env:
          DIST_PUSH_TOKEN: ${{ secrets.DIST_PUSH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          DIST_REPO: ${{ needs.resolve.outputs.dist_repo }}
        run: |
          set -euo pipefail
          if [ -z "${DIST_PUSH_TOKEN:-}" ]; then
            echo "::error::DIST_PUSH_TOKEN secret is not set — see playbooks/plugin-distribution.md for the owner setup steps (create the sb-dist repo, mint the PAT, add the secret)."
            exit 1
          fi
          git clone --quiet --depth 1 "https://x-access-token:${DIST_PUSH_TOKEN}@github.com/${OWNER}/${DIST_REPO}.git" dist-repo
      - name: wipe everything but .git, then copy the built tree in
        run: |
          set -euo pipefail
          find dist-repo -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a dist/. dist-repo/
      - name: commit and push (no-op if nothing changed)
        working-directory: dist-repo
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          TAG: ${{ needs.resolve.outputs.tag }}
          CHANNEL: ${{ needs.resolve.outputs.channel }}
          SOURCE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "sb-accelerator release bot"
          git config user.email "sb-accelerator-release-bot@users.noreply.github.com"
          git add -A
          # Idempotency gate: re-running this job for a tag/channel that was
          # already published (a re-dispatched dryrun repair, or the workflow
          # simply re-run) must be a safe no-op, not a duplicate/empty commit.
          if git diff --cached --quiet; then
            echo "already published — dist tree is unchanged, nothing to commit"
            exit 0
          fi
          sha7="${SOURCE_SHA:0:7}"
          git commit -m "re-cut: plugin ${VERSION} (source ${TAG} @ ${sha7}) — publish to ${CHANNEL}"
          git push origin HEAD:main
      - name: API read-back verification (never trust the local clone)
        env:
          GH_TOKEN: ${{ secrets.DIST_PUSH_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          DIST_REPO: ${{ needs.resolve.outputs.dist_repo }}
          EXPECTED_VERSION: ${{ needs.resolve.outputs.version }}
          EXPECTED_MARKETPLACE: ${{ needs.resolve.outputs.marketplace }}
        run: |
          set -euo pipefail
          repo="${OWNER}/${DIST_REPO}"

          got_version=$(gh api "repos/${repo}/contents/plugin/.claude-plugin/plugin.json" --jq '.content' \
            | base64 -d | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])")
          got_marketplace=$(gh api "repos/${repo}/contents/.claude-plugin/marketplace.json" --jq '.content' \
            | base64 -d | python3 -c "import json,sys; print(json.load(sys.stdin)['name'])")

          if [ "$got_version" != "$EXPECTED_VERSION" ]; then
            echo "::error::read-back plugin.json version ($got_version) != expected ($EXPECTED_VERSION)"
            exit 1
          fi
          if [ "$got_marketplace" != "$EXPECTED_MARKETPLACE" ]; then
            echo "::error::read-back marketplace name ($got_marketplace) != expected ($EXPECTED_MARKETPLACE)"
            exit 1
          fi
          echo "read-back OK via the GitHub API: plugin $got_version, marketplace $got_marketplace"

  github_release:
    name: GitHub Release
    needs: [resolve, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: install deps
        run: pip install pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: plugin-zip
          path: .
      - name: extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/build_dist.py notes --version "$VERSION" > release-notes.md
      - name: create or refresh the release (idempotent — never fails or duplicates on re-run)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — refreshing its notes"
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --verify-tag --notes-file release-notes.md
          fi
          gh release upload "$TAG" "plugin-${VERSION}.zip" "plugin-${VERSION}.zip.sha256" --clobber
