# Client deployment registry — one entry per deployed engagement.
# v1 is this file; moves to Airtable when client count justifies it (design doc, Phase 2).
# Written by scripts/provision_client.py (see playbooks/provisioning-runbook.md
# §6-7) — run it with --update at a tune-up rather than hand-editing an entry.
# --update only touches what you name: it restamps plugin_version and
# structure_version from the checkout it runs in and leaves every other field
# alone, so recording a release is `provision_client.py <slug> --update
# --register-only` with no other flags.
# Entry shape:
#   - client: <client-slug>
#     owner: <name or initials>
#     plugin_version: <semver deployed>
#     structure_version: <template structure-version deployed>
#     archetype: commercial-leader
#     care_package: active | lapsed | none
#     audience: client | internal        (who the vault owner is: a client, or
#                                         a delaware colleague. This alone names
#                                         the feedback repo, see below)
#     delivery_path: A | B | C | D | E   (playbooks/plugin-distribution.md path)
#     feedback_repo: <org>/sb-client-<slug> for audience: client,
#                    <org>/sb-internal-<slug> for audience: internal. Derived
#                    once, at registration, then kept as written: a registered
#                    name is a fact about a repo that exists. Renaming a live
#                    channel is a deliberate act, never a side effect.
#     dist_channel: client | dryrun      (which release channel feeds the vault.
#                                         Independent of audience: a colleague
#                                         dogfooding real releases is
#                                         audience: internal, dist_channel: client)
#     provisioned: <ISO date>            (the day this deployment was stood
#                                         up — written once, never moves)
#     token_minted: <ISO date>           (the day the feedback token was last
#                                         minted; its 1-year expiry counts
#                                         from here. Moved only by
#                                         --token-minted, at every rotation)
#     notes: ""
# No `machines` field — two machines per deployment is the runbook invariant;
# note any deviation in `notes` instead.
clients:
- client: dryrun
  owner: MB
  plugin_version: 0.11.8
  structure_version: '3'
  archetype: commercial-leader
  care_package: active
  audience: internal
  delivery_path: E
  feedback_repo: DLW-INT-BTA-BELUX/sb-client-dryrun
  dist_channel: dryrun
  provisioned: '2026-09-03'
  token_minted: '2026-09-03'
  notes: internal DryRunVault; feedback repo predates the sb-internal-<slug> route
    and keeps its name
- client: la-lorraine
