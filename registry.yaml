# Client deployment registry — one entry per deployed engagement.
# v1 is this file; moves to Airtable when client count justifies it (design doc, Phase 2).
# Written by scripts/provision_client.py (see playbooks/provisioning-runbook.md
# §6-7) — run it with --update at a tune-up rather than hand-editing an entry.
# Entry shape:
#   - client: <client-slug>
#     owner: <name or initials>
#     plugin_version: <semver deployed>
#     structure_version: <template structure-version deployed>
#     archetype: commercial-leader
#     care_package: active | lapsed | none
#     delivery_path: A | B | C | D | E   (playbooks/plugin-distribution.md path)
#     feedback_repo: <org>/sb-client-<client-slug>
#     dist_channel: client | dryrun
#     provisioned: <ISO date>            (starts the token-expiry clock)
#     notes: ""
# No `machines` field — two machines per deployment is the runbook invariant;
# note any deviation in `notes` instead.
clients: []
